<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#590907">
    <meta name="description" content="Sign in to your PitStop.co customer account.">
    <title>Sign in | PitStop.co</title>
    <link rel="stylesheet" href="styles/main.css">
    <script src="scripts/account.js" defer></script>
    <script src="scripts/auth-pages.js" defer></script>
  </head>
  <body>
    <div class="top-strip"><span id="account-slot"></span></div>
    <header class="site-header">
      <div class="sidebar-top">
        <a class="brand" href="index.html" aria-label="PitStop.co home">PitStop<span>.co</span></a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Open menu"><span></span></button>
      </div>
      <nav class="main-nav" id="site-nav" aria-label="Main navigation">
        <p class="nav-label">Shop</p>
          <a href="index.html"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 11.5 12 4.5l8 7"></path><path d="M6.5 10v9.5h11V10"></path></svg><span>Home</span></a>
          <a href="diecast.html"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 16.5H3.5v-4l2-5h13l2 5v4H19"></path><circle cx="7.5" cy="16.5" r="2"></circle><circle cx="16.5" cy="16.5" r="2"></circle><path d="M9.5 16.5h5M3.5 12.5h17"></path></svg><span>Diecast</span></a>
          <a href="about.html"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 11v5.5M12 7.8v.1"></path></svg><span>About</span></a>
          <a href="contact.html"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3.5" y="5.5" width="17" height="13" rx="2"></rect><path d="m4 7 8 6 8-6"></path></svg><span>Contact</span></a>
      </nav>
    </header>
    <main>
      <section class="account-page">
        <p class="eyebrow">CUSTOMER ACCOUNT</p>
        <h1>Welcome back.</h1>
        <p class="account-intro">Sign in to add models to your bag and manage your profile.</p>
        <form class="account-form" id="login-form">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <p class="form-message" id="form-message" role="alert"></p>
          <button class="primary-link account-submit" type="submit">Sign in</button>
        </form>
        <p class="account-switch">New to PitStop.co? <a href="register.html">Create an account</a></p>
      </section>
    </main>
    <footer class="site-footer">
      <div class="site-footer-inner">
        <div class="footer-main">
          <div><a class="brand" href="index.html">PitStop<span>.co</span></a><p class="footer-tagline">A small shop for diecast car collectors.</p></div>
          <nav class="footer-nav" aria-label="Footer navigation"><a href="diecast.html">Diecast</a><a href="about.html">About us</a><a href="contact.html">Contact</a><a class="footer-instagram" href="https://www.instagram.com/pitstop.co.my/" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3.5" y="3.5" width="17" height="17" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.2" cy="6.8" r="1"></circle></svg>Instagram</a></nav>
        </div>
        <div class="footer-bottom"><p>© <span id="year"></span> PitStop.co</p><p>Made for collectors.</p></div>
      </div>
    </footer>
  </body>
</html>
